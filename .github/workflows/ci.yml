
name: TaskFlow CI

on:
  # Run CI for pull requests targeting main.
  pull_request:
    branches:
      - main

  # Run CI and publish artifacts on main pushes.
  push:
    branches:
      - main

  # Allow manual execution from GitHub Actions UI.
  workflow_dispatch:

# Least-privilege permissions by default.
permissions:
  contents: read

# Avoid duplicate runs for the same PR or branch.
concurrency:
  group: taskflow-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  # ==========================================
  # FRONTEND CI
  # ==========================================
  frontend-ci:
    name: Frontend CI (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      # Only Node 22 produces the deployment artifact.
      - name: Upload frontend build
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7


  # ==========================================
  # BACKEND CI
  # ==========================================
  backend-ci:
    name: Backend CI (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Generate Prisma Client.
      - name: Generate Prisma Client
        run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/taskflow_ci

      - name: Run ESLint
        run: npm run lint

      - name: Run backend tests
        run: npm test

      - name: Build backend
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/taskflow_ci

      # Only Node 22 produces the deployment artifact.
      - name: Upload backend build
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: |
            backend/dist/
            backend/src/generated/prisma/
            backend/package.json
            backend/package-lock.json
            backend/prisma/schema.prisma
            backend/prisma/migrations/
            backend/prisma.config.ts
          if-no-files-found: error
          retention-days: 7


  # ==========================================
  # PUBLISH ARTIFACTS TO S3
  # ==========================================
  publish-artifacts:
    name: Publish Release Artifacts

    needs:
      - frontend-ci
      - backend-ci

    # Publish only after a successful push to main.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      RELEASE_SHA: ${{ github.sha }}

    steps:
      # Download frontend build.
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: release/frontend

      # Download backend build.
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: release/backend

      # Validate release contents.
      - name: Validate release artifacts
        shell: bash
        run: |
          set -euo pipefail

          test -f release/frontend/index.html
          test -f release/backend/dist/server.js
          test -f release/backend/prisma/schema.prisma
          test -f release/backend/package.json
          test -f release/backend/package-lock.json

          test -d release/backend/prisma/migrations

          echo "Release artifacts validated."

      # Create versioned release archives.
      - name: Package release artifacts
        shell: bash
        run: |
          set -euo pipefail

          tar -czf frontend.tar.gz \
            -C release/frontend .

          tar -czf backend.tar.gz \
            -C release/backend .

          printf '{"commit":"%s","run_id":"%s","run_number":"%s"}\n' \
            "$RELEASE_SHA" \
            "$GITHUB_RUN_ID" \
            "$GITHUB_RUN_NUMBER" > release-info.json

      # AWS OIDC authentication.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # Upload immutable release artifacts.
      - name: Upload artifacts to S3
        shell: bash
        run: |
          set -euo pipefail

          aws s3 cp frontend.tar.gz \
            "s3://${S3_BUCKET}/releases/${RELEASE_SHA}/frontend.tar.gz"

          aws s3 cp backend.tar.gz \
            "s3://${S3_BUCKET}/releases/${RELEASE_SHA}/backend.tar.gz"

          aws s3 cp release-info.json \
            "s3://${S3_BUCKET}/releases/${RELEASE_SHA}/release-info.json"

          echo "Release published successfully."
