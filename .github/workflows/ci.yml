
name: TaskFlow CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# Default permissions for all jobs.
permissions:
  contents: read

jobs:
  # ==========================================
  # FRONTEND CI
  # ==========================================
  frontend-ci:
    name: Frontend CI (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      # Upload only the Node 22 build.
      - name: Upload frontend build
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

  # ==========================================
  # BACKEND CI
  # ==========================================
  backend-ci:
    name: Backend CI (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Generate Prisma Client before tests and build.
      - name: Generate Prisma Client
        run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/taskflow_ci

      - name: Run ESLint
        run: npm run lint

      - name: Run backend tests
        run: npm test

      - name: Build backend
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/taskflow_ci

      # Upload everything required by production deployment.
      - name: Upload backend build
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: |
            backend/dist/
            backend/src/generated/prisma/
            backend/package.json
            backend/package-lock.json
            backend/prisma/schema.prisma
            backend/prisma/migrations/
            backend/prisma.config.ts
          if-no-files-found: error
          retention-days: 7

  # ==========================================
  # PUBLISH ARTIFACTS TO AWS S3
  # ==========================================
  publish-artifacts:
    name: Publish Artifacts to S3

    needs:
      - frontend-ci
      - backend-ci

    # Only publish successful pushes to main.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      RELEASE_SHA: ${{ github.sha }}

    steps:
      # Download frontend artifact.
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: release/frontend

      # Download backend artifact.
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: release/backend

      # Validate the downloaded artifacts.
      - name: Validate release artifacts
        shell: bash
        run: |
          set -euo pipefail

          test -f release/frontend/index.html

          test -f release/backend/dist/server.js

          test -f release/backend/dist/generated/prisma/client.js

          test -f release/backend/prisma/schema.prisma

          test -f release/backend/prisma.config.ts

          test -d release/backend/prisma/migrations

          test -f release/backend/package.json
          test -f release/backend/package-lock.json

          echo "All release artifacts validated."

      # Package release artifacts.
      - name: Create release archives
        shell: bash
        run: |
          set -euo pipefail

          tar -czf frontend.tar.gz \
            -C release/frontend .

          tar -czf backend.tar.gz \
            -C release/backend .

          printf '{"commit":"%s","run_id":"%s","run_number":"%s"}\n' \
            "$RELEASE_SHA" \
            "$GITHUB_RUN_ID" \
            "$GITHUB_RUN_NUMBER" > release-info.json

          echo "Release archives created."

      # ======================================
      # AWS OIDC AUTHENTICATION
      # ======================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # ======================================
      # UPLOAD ARTIFACTS TO S3
      # ======================================
      - name: Upload artifacts to S3
        shell: bash
        run: |
          set -euo pipefail

          aws s3 cp frontend.tar.gz \
            "s3://${S3_BUCKET}/releases/${RELEASE_SHA}/frontend.tar.gz" \
            --region "$AWS_REGION"

          aws s3 cp backend.tar.gz \
            "s3://${S3_BUCKET}/releases/${RELEASE_SHA}/backend.tar.gz" \
            --region "$AWS_REGION"

          aws s3 cp release-info.json \
            "s3://${S3_BUCKET}/releases/${RELEASE_SHA}/release-info.json" \
            --region "$AWS_REGION"

          echo "All release artifacts uploaded successfully."

