
name: TaskFlow CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# Default permissions for all jobs.
permissions:
  contents: read

jobs:
  # ==========================================
  # FRONTEND CI
  # ==========================================
  frontend-ci:
    name: Frontend CI (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      # Upload artifact only once from Node 22.
      - name: Upload frontend build
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

  # ==========================================
  # BACKEND CI
  # ==========================================
  backend-ci:
    name: Backend CI (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Generate Prisma Client without connecting to a database.
      - name: Generate Prisma Client
        run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/taskflow_ci

      - name: Run ESLint
        run: npm run lint

      - name: Run backend tests
        run: npm test

      - name: Build backend
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/taskflow_ci

      # Upload artifact only once from Node 22.
      - name: Upload backend build
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: |
            backend/dist/
            backend/src/generated/prisma/
            backend/package.json
            backend/package-lock.json
            backend/prisma/
          if-no-files-found: error
          retention-days: 7

  # ==========================================
  # PUBLISH ARTIFACTS TO AWS S3
  # ==========================================
  publish-artifacts:
    name: Publish Artifacts to S3

    needs:
      - frontend-ci
      - backend-ci

    # Publish only after successful CI on main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    # OIDC permission is required for AWS authentication.
    permissions:
      contents: read
      id-token: write

    steps:
      # Download frontend build from this workflow run.
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: release/frontend

      # Download backend build from this workflow run.
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: release/backend

      # Package release artifacts.
      - name: Create release archives
        run: |
          set -euo pipefail

          tar -czf frontend.tar.gz -C release/frontend .
          tar -czf backend.tar.gz -C release/backend .

          # Create release metadata for traceability.
          printf '{"commit":"%s","run_id":"%s","run_number":"%s"}\n' \
            "$GITHUB_SHA" \
            "$GITHUB_RUN_ID" \
            "$GITHUB_RUN_NUMBER" > release-info.json

      # ======================================
      # TEMPORARY OIDC DEBUGGING
      # Remove this step after troubleshooting.
      # ======================================
      - name: Debug OIDC claims
        shell: bash
        run: |
          set -euo pipefail

          # Request an OIDC token for AWS STS.
          TOKEN=$(curl -fsSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')

          # Decode identity claims without printing the token.
          OIDC_TOKEN="$TOKEN" python3 - <<'PY'
          import os
          import json
          import base64

          token = os.environ["OIDC_TOKEN"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          for key in (
              "iss",
              "aud",
              "sub",
              "repository",
              "ref",
              "environment"
          ):
              print(f"{key}: {claims.get(key)}")
          PY

      # ======================================
      # AWS OIDC AUTHENTICATION
      # ======================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      # Verify temporary AWS credentials.
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # ======================================
      # UPLOAD ARTIFACTS TO S3
      # ======================================
      - name: Upload artifacts to S3
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Upload immutable, commit-specific release files.
          aws s3 cp frontend.tar.gz \
            "s3://${S3_BUCKET}/releases/${COMMIT_SHA}/frontend.tar.gz"

          aws s3 cp backend.tar.gz \
            "s3://${S3_BUCKET}/releases/${COMMIT_SHA}/backend.tar.gz"

          aws s3 cp release-info.json \
            "s3://${S3_BUCKET}/releases/${COMMIT_SHA}/release-info.json"

          echo "All release artifacts uploaded successfully."
