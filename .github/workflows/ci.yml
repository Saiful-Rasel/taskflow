
name: TaskFlow CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# Default permissions for CI jobs.
permissions:
  contents: read

jobs:
  # ------------------------------------------
  # FRONTEND CI
  # ------------------------------------------
  frontend-ci:
    name: Frontend CI (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      # Upload only once from Node 22.
      - name: Upload frontend build
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------
  # BACKEND CI
  # ------------------------------------------
  backend-ci:
    name: Backend CI (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Prisma Client generation does not require a running database.
      - name: Generate Prisma Client
        run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/taskflow_ci

      - name: Run ESLint
        run: npm run lint

      - name: Run backend tests
        run: npm test

      - name: Build backend
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/taskflow_ci

      # Upload only once from Node 22.
      - name: Upload backend build
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: |
            backend/dist/
            backend/src/generated/prisma/
            backend/package.json
            backend/package-lock.json
            backend/prisma/
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------
  # PUBLISH ARTIFACTS TO AWS S3
  # ------------------------------------------
  publish-artifacts:
    name: Publish Artifacts to S3

    # Run only after both CI jobs succeed.
    needs:
      - frontend-ci
      - backend-ci

    # Never upload artifacts from pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    # OIDC permission is needed only by this job.
    permissions:
      contents: read
      id-token: write

    steps:
      # Download frontend artifact from this workflow run.
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: release/frontend

      # Download backend artifact from this workflow run.
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: release/backend

      # Package both builds for deployment.
      - name: Create release archives
        run: |
          tar -czf frontend.tar.gz -C release/frontend .
          tar -czf backend.tar.gz -C release/backend .

          # Save release metadata for traceability.
          printf '{"commit":"%s","run_id":"%s","run_number":"%s"}\n' \
            "$GITHUB_SHA" \
            "$GITHUB_RUN_ID" \
            "$GITHUB_RUN_NUMBER" > release-info.json

      # Authenticate with AWS using GitHub OIDC.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Upload immutable, commit-specific release artifacts.
      - name: Upload artifacts to S3
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          aws s3 cp frontend.tar.gz \
            "s3://${S3_BUCKET}/releases/${COMMIT_SHA}/frontend.tar.gz"

          aws s3 cp backend.tar.gz \
            "s3://${S3_BUCKET}/releases/${COMMIT_SHA}/backend.tar.gz"

          aws s3 cp release-info.json \
            "s3://${S3_BUCKET}/releases/${COMMIT_SHA}/release-info.json"
