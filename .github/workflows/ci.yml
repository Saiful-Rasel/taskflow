
name: TaskFlow CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# Restrict workflow permissions to the minimum required.
permissions:
  contents: read

jobs:
  frontend-ci:
    name: Frontend CI (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      # Upload one artifact from Node 22 to avoid duplicates.
      - name: Upload frontend build
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

  backend-ci:
    name: Backend CI (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Prisma config requires DATABASE_URL.
      # Client generation does not connect to PostgreSQL.
      - name: Generate Prisma Client
        run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/taskflow_ci

      - name: Run ESLint
        run: npm run lint

      - name: Run backend tests
        run: npm test

      - name: Build backend
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/taskflow_ci

      # Upload one artifact from Node 22 to avoid duplicates.
      - name: Upload backend build
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: |
            backend/dist/
            backend/src/generated/prisma/
            backend/package.json
            backend/package-lock.json
            backend/prisma/
          if-no-files-found: error
          retention-days: 7
